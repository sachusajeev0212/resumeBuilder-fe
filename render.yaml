services:
  - type: web
    name: resumebuilder-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://resumebuilder-be-oxow.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
